<ng-template #content>
  <ng-content />
</ng-template>

@if (link()) {
  <a
    [routerLink]="link()"
    class="inline-flex items-center gap-2 mt-6 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 cursor-pointer"
  >
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
} @else {
  <button
    [type]="type()"
    [disabled]="disabled()"
    (click)="clicked.emit()"
    class="inline-flex items-center gap-2 mt-6 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 enabled:cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
  >
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </button>
}
